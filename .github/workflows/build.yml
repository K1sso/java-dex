name: Compile DEX
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание репозитория
        uses: actions/checkout@v4

      - name: Установка окружения Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Компиляция в classes.dex
        run: |
          mkdir -p bin output

          # 1. Проверяем наличие .java файлов
          JAVA_FILES=$(find . -maxdepth 2 -iname "*.java")
          if [ -z "$JAVA_FILES" ]; then
            echo "Ошибка: в репозитории не найдено ни одного .java файла!"
            exit 1
          fi

          # 2. Авто-исправление имен файлов под объявленные public классы
          find . -maxdepth 2 -iname "*.java" | while read -r file; do
            # Извлекаем имя класса после public class / public enum / public interface
            CLASS_NAME=$(grep -m1 -oE 'public[[:space:]]+(final[[:space:]]+|abstract[[:space:]]+)?(class|enum|interface|record)[[:space:]]+[a-zA-Z0-9_$]+' "$file" | awk '{print $NF}')
            
            if [ -n "$CLASS_NAME" ]; then
              DIR=$(dirname "$file")
              TARGET="$DIR/${CLASS_NAME}.java"
              if [ "$file" != "$TARGET" ]; then
                echo "Авто-переименование: $file -> $TARGET"
                mv "$file" "$TARGET"
              fi
            fi
          done

          # 3. Собираем актуальный список и компилируем
          find . -maxdepth 2 -iname "*.java" > sources.txt
          javac -d bin @sources.txt

          # 4. Упаковываем байт-код в classes.dex через d8
          D8_PATH=$(find $ANDROID_SDK_ROOT/build-tools -name d8 | sort -V | tail -n 1)
          "$D8_PATH" $(find bin -name "*.class") --output output/

      - name: Загрузка готового classes.dex
        uses: actions/upload-artifact@v4
        with:
          name: compiled-dex
          path: output/classes.dex
