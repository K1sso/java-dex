name: build-mtp
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile, dex, pack
        run: |
          set -euo pipefail
          mkdir -p bin dex stage

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          ANDROID_JAR=$(ls -d "$SDK"/platforms/*/android.jar | sort -V | tail -n 1)
          D8=$(find "$SDK/build-tools" -name d8 -type f | sort -V | tail -n 1)

          echo "SDK=$SDK"
          echo "ANDROID_JAR=$ANDROID_JAR"
          echo "D8=$D8"

          javac -nowarn -classpath "$ANDROID_JAR" -d bin \
            $(find stub -name '*.java') \
            $(find java -name '*.java')

          if [ ! -f bin/deven1/beep/SoundPlugin.class ]; then
            echo "ERROR: javac did not produce SoundPlugin.class"
            exit 1
          fi

          # В dex идут ВСЕ class-файлы твоего пакета, включая SoundPlugin$1.class
          "$D8" --lib "$ANDROID_JAR" --output dex/ $(find bin/deven1 -name '*.class')

          if ! grep -q 'Ldeven1/beep/SoundPlugin;' dex/classes.dex; then
            echo "ERROR: class not found inside classes.dex"
            exit 1
          fi

          cp manifest.json stage/
          cp dex/classes.dex stage/
          (cd stage && zip -X ../deven1.beep.mtp manifest.json classes.dex)
          ls -l deven1.beep.mtp

      - uses: actions/upload-artifact@v4
        with:
          name: deven1-beep-mtp
          path: deven1.beep.mtp
