name: build-mtp
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile, dex, pack
        run: |
          set -euo pipefail
          mkdir -p bin dex stage

          ANDROID_JAR=$(ls -d "$ANDROID_HOME"/platforms/*/android.jar | sort -V | tail -n 1)
          D8=$(find "$ANDROID_HOME/build-tools" -name d8 -type f | sort -V | tail -n 1)
          DEXDUMP=$(find "$ANDROID_HOME/build-tools" -name dexdump -type f | sort -V | tail -n 1)

          # Компилируем против android.jar и заглушки API
          javac -nowarn -classpath "$ANDROID_JAR" -d bin \
            $(find stub -name '*.java') \
            $(find java -name '*.java')

          # В dex кладём ТОЛЬКО свой класс, заглушку API не кладём
          "$D8" --lib "$ANDROID_JAR" --output dex/ bin/deven1/beep/SoundPlugin.class

          # Самопроверка: класс обязан быть внутри dex, иначе сборка падает
          "$DEXDUMP" dex/classes.dex | grep -q 'Ldeven1/beep/SoundPlugin;' \
            || { echo "ERROR: SoundPlugin not found in classes.dex"; exit 1; }

          # .mtp: в корне архива только manifest.json и classes.dex
          cp manifest.json stage/
          cp dex/classes.dex stage/
          (cd stage && zip -X ../deven1.beep.mtp manifest.json classes.dex)

      - uses: actions/upload-artifact@v4
        with:
          name: deven1-beep-mtp
          path: deven1.beep.mtp
